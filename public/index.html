<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071316"><meta name="description" content="Личный журнал силовых тренировок, прогресса и восстановления."><title>Журнал тренировок</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="icon" type="image/jpeg" href="/icons/app-icon.jpg"><link rel="apple-touch-icon" href="/icons/app-icon.jpg"><link rel="manifest" href="/manifest.webmanifest"><link rel="preload" as="image" href="/images/mountain-bg-hq.jpg" fetchpriority="high"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/coach.css"></head><body><div id="splash" role="status" aria-label="Загрузка Training Journal"><div class="splash-glow"></div><div class="splash-brand"><img src="/icons/app-icon.jpg" alt=""><div class="splash-title">Training<br>Journal</div><p>Твой путь<br>к сильной версии себя</p><div class="splash-loader"></div><span>Загрузка...</span></div></div><main><header><h1><span>Журнал</span> <i>тренировок</i></h1><div class="header-actions"><button id="install-app" type="button" hidden>Установить</button><button id="av" type="button" aria-label="Личный кабинет"></button></div></header><nav id="nav"></nav><div id="v"></div><div id="rest" hidden><section class="rest-dialog" role="dialog" aria-modal="true" aria-label="Таймер отдыха"><span id="rt" aria-live="off"></span><div class="rest-actions"><button id="rplus" type="button" aria-label="Добавить 15 секунд" title="Добавить 15 секунд">+15</button><button id="rs" type="button" aria-label="Завершить отдых" title="Завершить отдых">✓</button></div></section></div></main><script type="module" src="/js/app.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/service-worker.js").catch(()=>{}));}</script><script>
let installPrompt=null;
const installButton=document.getElementById('install-app');
window.addEventListener('beforeinstallprompt',event=>{
 event.preventDefault();installPrompt=event;installButton.hidden=false;
 installButton.textContent='Установить';
});
window.addEventListener('appinstalled',()=>{
 installPrompt=null;installButton.hidden=true;
});
installButton.addEventListener('click',async()=>{
 if(!installPrompt){
  alert('Чтобы установить журнал, откройте меню браузера (\u22ee) и выберите «Установить приложение» или «Установить Training Journal».');
  return;
 }
 installButton.disabled=true;
 try{
  const promptEvent=installPrompt;
  await promptEvent.prompt();
  const choice=await promptEvent.userChoice;
  installPrompt=null;
  if(choice && choice.outcome==='accepted'){
   installButton.hidden=true;
  }else{
   installButton.hidden=false;
   installButton.textContent='Как установить';
  }
 }catch(e){
  installPrompt=null;
  installButton.hidden=false;
  installButton.textContent='Как установить';
 }finally{
  installButton.disabled=false;
 }
});
</script></body></html>
